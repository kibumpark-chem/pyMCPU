version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    # nbsphinx shells out to pandoc to convert the markdown cells of
    # docs/tutorials/01_single_trajectory.ipynb. The RTD build image does not
    # ship pandoc, so without this the build dies on that one notebook -- and
    # it passes locally only because this workstation happens to have pandoc.
    - pandoc

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    # Install ONLY the docs toolchain, not the package. Building pymcpu means
    # compiling a C++20 extension against Eigen, which Read the Docs cannot do
    # (and which the previous `path: .` here silently attempted). docs/conf.py
    # mocks pymcpu.mcpu_core plus the heavy runtime deps and puts the repo root
    # on sys.path, so autodoc imports the pure-Python layer without a compiler.
    - requirements: docs/requirements.txt
