name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    # Pinned like ci.yml: ubuntu-latest becomes Ubuntu 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.21"
      - run: ruff check .
